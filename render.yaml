services:
  - type: web
    name: halder
    runtime: node
    plan: free
    # Supabase veritabanı Frankfurt'ta (eu-central-1); servis de yakınında çalışsın.
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /halder/api/saglik
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /halder
      # Supabase > Connect > Direct > Session pooler (URI). [YOUR-PASSWORD] yerine veritabanı şifresi yazılır.
      - key: DATABASE_URL
        sync: false
      # İlk açılışta admin hesabı bunlarla oluşturulur (admin yoksa).
      - key: ADMIN_TELEFON
        sync: false
      # Render güçlü bir şifre üretir; Render > halder > Environment bölümünden görülebilir.
      - key: ADMIN_SIFRE
        generateValue: true
      - key: ADMIN_AD
        value: Admin
